<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride — Running Training Plan Builder</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#fff; --ink:#1c1f23; --muted:#6b7078; --line:#e3e1da;
  --accent:#e4572e; --accent-ink:#fff;
  --easy:#4caf7d; --long:#2f6fd6; --tempo:#e79a1b; --intervals:#d6453d;
  --recovery:#7fc7a8; --race:#8a3ffc; --cross:#3aa6b9; --strength:#7a6f5c; --rest:#c5c3bc;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--ink);color:#fff;flex-wrap:wrap}
header h1{margin:0;font-size:20px;letter-spacing:.5px}
header h1 span{color:var(--accent)}
header .spacer{flex:1}
header select{background:#2b2f35;color:#fff;border:1px solid #444;border-radius:8px;padding:6px 10px;max-width:240px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:#bbb}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:inherit;border-color:#555}
.signin{position:fixed;inset:0;background:rgba(28,31,35,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.signin[hidden]{display:none}
.signin .card{background:#fff;border-radius:16px;padding:32px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.signin h2{margin:0 0 6px;font-size:24px}
.signin h2 span{color:var(--accent)}
.signin p{color:var(--muted);margin:0 0 22px}
.signin .google{width:100%;padding:12px;font-size:16px;font-weight:600}
.signin .skip{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.sync-status{font-size:13px;color:#b9bdc3}
.sync-status.ok::before{content:"● ";color:#4caf7d}
.sync-status.err::before{content:"● ";color:#e4572e}
.btn.danger{color:#c0392b}
.btn.small{padding:3px 8px;font-size:13px}
main{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.plan-head{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.plan-name{font-size:20px;font-weight:600;min-width:260px}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:14px;border-bottom:1px solid var(--line)}
.chart div{flex:1;background:var(--long);border-radius:3px 3px 0 0;min-height:2px;position:relative;opacity:.85}
.chart div:hover{opacity:1}
.chart div.cur{background:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;grid-template-columns:110px repeat(7,1fr) 80px;gap:6px}
.grid .hd{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:4px 0}
.week-label{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.week-label b{font-size:14px}
.week-label .acts{display:flex;gap:3px;flex-wrap:wrap}
.week-label .acts button{border:none;background:#f0eee8;border-radius:5px;font-size:11px;padding:2px 5px;cursor:pointer}
.week-label .acts button:hover{background:#e2dfd6}
.week-row.current .week-label{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rest);border-radius:10px;padding:7px 8px;min-height:84px;cursor:pointer;font-size:13px;position:relative;transition:transform .08s}
.day:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.day .date{font-size:11px;color:var(--muted)}
.day .type{font-weight:600;margin-top:2px}
.day .dist{font-size:16px;font-weight:700}
.day .notes{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.day.done::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--easy);font-weight:700}
.day.empty{background:#faf9f6}
.day.rest{background:#faf9f6;color:var(--muted)}
.total{display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px}
.total b{font-size:17px;color:var(--ink)}
.week-row{display:contents}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
dialog{border:none;border-radius:14px;padding:0;width:min(460px,94vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,22,25,.45)}
.dlg{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:18px}
.dlg .row{display:flex;gap:10px}
.dlg .row .field{flex:1}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.dlg .foot .left{margin-right:auto}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;cursor:pointer;font-size:13px}
.types button.sel{color:#fff}
.empty-state{text-align:center;padding:60px 20px}
.empty-state h2{margin-top:0}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .grid .hd{display:none}
  .week-label{flex-direction:row;align-items:center;justify-content:space-between;margin-top:10px}
  .day{min-height:auto}
  .total{flex-direction:row;gap:6px;padding:6px}
}
@media print{
  header,.toolbar,.week-label .acts,.no-print{display:none!important}
  body{background:#fff;font-size:11px}
  main{padding:0;max-width:none}
  .panel{border:none;padding:0}
  .day{min-height:60px;break-inside:avoid}
  .grid{grid-template-columns:70px repeat(7,1fr) 50px}
  .grid .hd{display:block}
}
</style>
</head>
<body>
<header>
  <h1>Stride<span>.</span></h1>
  <select id="planSelect" title="Your plans"></select>
  <button class="btn ghost" id="newPlanBtn">+ New plan</button>
  <div class="spacer"></div>
  <span id="syncStatus" class="sync-status"></span>
  <button class="btn ghost" id="authBtn" hidden>Sign in to sync</button>
  <button class="btn ghost" id="importBtn">Import</button>
  <button class="btn ghost" id="exportBtn">Export</button>
  <button class="btn ghost" id="printBtn">Print</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</header>

<main id="app"></main>

<div class="signin" id="signinOverlay" hidden>
  <div class="card">
    <h2>Stride<span>.</span></h2>
    <p>Sign in to see your training plans on all your devices.</p>
    <button class="btn primary google" id="signinGo">Continue with Google</button>
    <button class="skip" id="signinSkip">Use without signing in</button>
  </div>
</div>

<!-- Workout editor -->
<dialog id="dayDlg">
  <form method="dialog" class="dlg" id="dayForm">
    <h2 id="dayTitle">Edit workout</h2>
    <div class="field"><label>Type</label><div class="types" id="typePicker"></div></div>
    <div class="row">
      <div class="field"><label id="distLabel">Distance</label><input type="number" step="0.1" min="0" id="fDist"></div>
      <div class="field"><label>Duration (min)</label><input type="number" step="1" min="0" id="fDur"></div>
    </div>
    <div class="field"><label>Pace / effort target</label><input type="text" id="fPace" placeholder="e.g. 8:30/mi, conversational, RPE 7"></div>
    <div class="field"><label>Details</label><textarea id="fNotes" rows="3" placeholder="e.g. 6 × 800m @ 5K pace, 400m jog recovery"></textarea></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fDone"> Completed</label>
    <div class="foot">
      <button type="button" class="btn danger left" id="clearDay">Clear</button>
      <button type="button" class="btn" id="cancelDay">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- New plan -->
<dialog id="newDlg">
  <form method="dialog" class="dlg" id="newForm">
    <h2>New training plan</h2>
    <div class="field"><label>Plan name</label><input id="nName" required value="My training plan"></div>
    <div class="row">
      <div class="field"><label>Start date (week 1)</label><input type="date" id="nStart" required></div>
      <div class="field"><label>Weeks</label><input type="number" id="nWeeks" min="1" max="52" value="12" required></div>
    </div>
    <div class="row">
      <div class="field"><label>Units</label><select id="nUnits"><option value="mi">Miles</option><option value="km">Kilometers</option></select></div>
      <div class="field"><label>Start from</label>
        <select id="nTemplate">
          <option value="blank">Blank calendar</option>
          <option value="5k">5K template</option>
          <option value="10k">10K template</option>
          <option value="half">Half marathon template</option>
          <option value="marathon">Marathon template</option>
        </select>
      </div>
    </div>
    <div class="row" id="volRow">
      <div class="field"><label>Starting weekly volume</label><input type="number" id="nStartVol" min="1" step="1"></div>
      <div class="field"><label>Peak weekly volume</label><input type="number" id="nPeakVol" min="1" step="1"></div>
    </div>
    <p class="hint" id="tplHint">Templates give you a starting point with gradual build-up, a lighter week every 4th week, and a taper before race day. You can edit every day afterwards.</p>
    <div class="foot">
      <button type="button" class="btn" id="cancelNew">Cancel</button>
      <button type="submit" class="btn primary">Create plan</button>
    </div>
  </form>
</dialog>

<script>
(() => {
const TYPES = {
  easy:{label:"Easy",color:"var(--easy)"},
  long:{label:"Long run",color:"var(--long)"},
  tempo:{label:"Tempo",color:"var(--tempo)"},
  intervals:{label:"Intervals",color:"var(--intervals)"},
  recovery:{label:"Recovery",color:"var(--recovery)"},
  race:{label:"Race",color:"var(--race)"},
  cross:{label:"Cross-train",color:"var(--cross)"},
  strength:{label:"Strength",color:"var(--strength)"},
  rest:{label:"Rest",color:"var(--rest)"}
};
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const STORE_KEY = "stride-plans-v1";

// ---------- storage ----------
let state = {plans:[], currentId:null};
function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s && Array.isArray(s.plans)) state = s; }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  pushCloud();
}

// ---------- cloud sync (Firebase) ----------
// Paste your Firebase web app config here to turn on syncing across devices.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBWUb0_mgmS2prnekmuEPI6JJcJsp_gORI",
  authDomain: "running-planner-e6cdf.firebaseapp.com",
  projectId: "running-planner-e6cdf",
  storageBucket: "running-planner-e6cdf.firebasestorage.app",
  messagingSenderId: "944538122128",
  appId: "1:944538122128:web:bfdad07a9b3d7180956515"
};
const FIREBASE_VERSION = "10.12.2";
let cloud = null; // {fs, col, synced:{planId: json}, ready}
const authBtn = document.getElementById("authBtn");
const syncStatus = document.getElementById("syncStatus");
function setStatus(text, cls=""){ syncStatus.textContent = text; syncStatus.className = "sync-status " + cls; }

function pushCloud(){
  if(!cloud || !cloud.ready) return;
  const {fs, col, synced} = cloud;
  const ids = new Set(state.plans.map(p => p.id));
  state.plans.forEach(p => {
    const json = JSON.stringify(p);
    if(synced[p.id] === json) return;
    synced[p.id] = json;
    setStatus("Saving…");
    fs.setDoc(fs.doc(col, p.id), {json, updated: fs.serverTimestamp()})
      .catch(err => setStatus("Sync error", "err"));
  });
  Object.keys(synced).forEach(id => {
    if(ids.has(id)) return;
    delete synced[id];
    fs.deleteDoc(fs.doc(col, id)).catch(err => setStatus("Sync error", "err"));
  });
}

async function initCloud(){
  if(!FIREBASE_CONFIG) return;
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  let appMod, authMod, fs;
  try{
    [appMod, authMod, fs] = await Promise.all([
      import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")
    ]);
  }catch(e){ setStatus("Sync unavailable", "err"); return; }
  const fbApp = appMod.initializeApp(FIREBASE_CONFIG);
  const auth = authMod.getAuth(fbApp);
  const db = fs.getFirestore(fbApp);
  authBtn.hidden = false;

  const overlay = document.getElementById("signinOverlay");
  const doSignIn = async () => {
    const provider = new authMod.GoogleAuthProvider();
    try{ await authMod.signInWithPopup(auth, provider); }
    catch(e){
      if(e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")
        authMod.signInWithRedirect(auth, provider);
      else if(e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request")
        alert("Sign-in failed: " + e.message);
    }
  };
  authBtn.onclick = async () => {
    if(auth.currentUser){
      if(confirmAction("Sign out? Your plans stay saved in your account.")){
        try{ sessionStorage.setItem("stride-skip-signin", "1"); }catch(e){}
        await authMod.signOut(auth);
      }
      return;
    }
    doSignIn();
  };
  document.getElementById("signinGo").onclick = doSignIn;
  document.getElementById("signinSkip").onclick = () => {
    overlay.hidden = true;
    try{ sessionStorage.setItem("stride-skip-signin", "1"); }catch(e){}
  };

  let unsub = null;
  authMod.onAuthStateChanged(auth, user => {
    if(unsub){ unsub(); unsub = null; }
    cloud = null;
    if(!user){
      authBtn.textContent = "Sign in to sync"; authBtn.title = ""; setStatus("Not synced");
      let skipped = false; try{ skipped = sessionStorage.getItem("stride-skip-signin") === "1"; }catch(e){}
      overlay.hidden = skipped;
      return;
    }
    overlay.hidden = true;
    authBtn.textContent = "Sign out";
    authBtn.title = "Signed in as " + (user.email || user.displayName || "");
    setStatus("Syncing…");
    const col = fs.collection(db, "users", user.uid, "plans");
    cloud = {fs, col, synced:{}, ready:false};
    unsub = fs.onSnapshot(col, snap => {
      if(!cloud.ready && snap.metadata.fromCache) return; // wait for real server data before first merge
      const remote = {};
      snap.forEach(d => { try{ remote[d.id] = JSON.parse(d.data().json); }catch(e){} });
      const synced = {};
      Object.entries(remote).forEach(([id, p]) => synced[id] = JSON.stringify(p));
      if(!cloud.ready){
        // First load after sign-in: keep any plans made on this device that aren't in the cloud yet.
        state.plans.forEach(p => { if(!remote[p.id]) remote[p.id] = p; });
        cloud.ready = true;
      }
      cloud.synced = synced;
      state.plans = Object.values(remote).sort((a,b) => (a.created||0) - (b.created||0));
      if(!current()) state.currentId = state.plans[0]?.id || null;
      save();
      safeRender();
      if(!snap.metadata.hasPendingWrites) setStatus("Synced", "ok");
    }, err => setStatus("Sync error", "err"));
  });
}

// Don't redraw while you're typing in a field; redraw when you leave it.
let renderDeferred = false;
function safeRender(){
  const a = document.activeElement;
  if(a && app.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){
    if(!renderDeferred){ renderDeferred = true; a.addEventListener("blur", () => { renderDeferred = false; render(); }, {once:true}); }
    return;
  }
  render();
}
const uid = () => Math.random().toString(36).slice(2,10);
const current = () => state.plans.find(p => p.id === state.currentId) || null;

// ---------- dates ----------
function parseDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function fmtISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtShort(d){ return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; return addDays(x,-wd); }
function todayISO(){ return fmtISO(new Date()); }

// ---------- plan helpers ----------
const emptyDay = () => ({type:"", dist:"", dur:"", pace:"", notes:"", done:false});
const emptyWeek = () => DAYS.map(emptyDay);
const round = (n, step=0.5) => Math.max(step, Math.round(n/step)*step);
function weekTotal(w){ return w.reduce((s,d)=> s + (parseFloat(d.dist)||0), 0); }
function fmtNum(n){ return (Math.round(n*10)/10).toString(); }

// ---------- template generator ----------
const GOALS = {
  "5k":       {name:"5K",            race:3.1,  start:15, peak:25, longCap:7,  taper:1},
  "10k":      {name:"10K",           race:6.2,  start:18, peak:32, longCap:10, taper:1},
  "half":     {name:"Half marathon", race:13.1, start:20, peak:38, longCap:13, taper:2},
  "marathon": {name:"Marathon",      race:26.2, start:25, peak:50, longCap:20, taper:3}
};
const KM = 1.609;
function buildTemplate(goalKey, nWeeks, startVol, peakVol, units){
  const g = GOALS[goalKey];
  const f = units === "km" ? KM : 1;
  const longCap = g.longCap * f, raceDist = Math.round(g.race * f * 10)/10;
  const taper = Math.min(g.taper, Math.max(0, nWeeks-2));
  const build = nWeeks - taper;
  const weeks = [];
  for(let w=0; w<nWeeks; w++){
    let vol;
    if(w < build){
      const t = build > 1 ? w/(build-1) : 1;
      vol = startVol + (peakVol - startVol) * t;
      if((w+1) % 4 === 0 && w !== build-1) vol *= 0.75; // cutback week
    } else {
      const k = w - build + 1; // 1..taper
      vol = peakVol * (1 - 0.25*k);
    }
    const isRaceWeek = w === nWeeks-1;
    const phase = w < build*0.4 ? "base" : (w < build ? "build" : "taper");
    const week = emptyWeek();
    const long = Math.min(longCap, vol*0.3);
    const set = (i, type, dist, notes, pace="") => { week[i] = {type, dist: dist===""?"":round(dist), dur:"", pace, notes, done:false}; };

    set(0, "rest", "", "Rest or gentle mobility");
    if(phase === "base"){
      set(1, "easy", vol*0.15, "Easy + 6 × 20s strides", "Conversational");
      set(3, "easy", vol*0.2, "Easy, relaxed", "Conversational");
    } else if(phase === "build"){
      const reps = goalKey==="5k" ? "6–8 × 400m @ 5K pace, 200m jog" :
                   goalKey==="10k" ? "5 × 1km @ 10K pace, 2 min jog" :
                   goalKey==="half" ? "4 × 1 mile @ 10K–half pace, 2 min jog" :
                   "3 × 2 miles @ marathon pace, 3 min jog";
      set(1, "intervals", vol*0.15, "Warm-up, " + reps + ", cool-down", "Hard but controlled");
      set(3, "tempo", vol*0.2, "Warm-up, 20–30 min steady tempo, cool-down", "Comfortably hard");
    } else {
      set(1, "intervals", vol*0.15, "Short sharpening: 4–6 × 400m at goal pace", "Goal pace");
      set(3, "easy", vol*0.2, "Easy, a few strides", "Conversational");
    }
    set(2, "easy", vol*0.15, "Easy", "Conversational");
    set(4, "cross", "", "Optional cross-training or rest");
    week[4].dur = 30;
    set(5, "easy", vol*0.2, "Easy", "Conversational");
    set(6, "long", long, phase==="build" && goalKey!=="5k" ? "Long run, last 15–20 min at goal pace" : "Long run, easy effort", "Easy");

    if(isRaceWeek){
      set(5, "easy", 2*f, "Shakeout + 4 strides", "Very easy");
      set(4, "rest", "", "Rest");
      set(6, "race", raceDist, g.name + " race day! 🏁", "Goal pace");
    }
    weeks.push(week);
  }
  return weeks;
}

// ---------- render ----------
const app = document.getElementById("app");
const planSelect = document.getElementById("planSelect");

function renderSelect(){
  planSelect.innerHTML = state.plans.length
    ? state.plans.map(p => `<option value="${p.id}" ${p.id===state.currentId?"selected":""}>${esc(p.name)}</option>`).join("")
    : `<option>No plans yet</option>`;
  planSelect.disabled = !state.plans.length;
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  renderSelect();
  const p = current();
  if(!p){
    app.innerHTML = `<div class="panel empty-state">
      <h2>Build your running plan</h2>
      <p class="hint" style="font-size:15px">Create a plan from scratch or start from a 5K, 10K, half or marathon template — then edit any day you like.<br>Plans are saved in this browser. Sign in to sync them across your devices, or use Export to back them up.</p>
      <button class="btn primary" onclick="document.getElementById('newPlanBtn').click()">+ Create your first plan</button>
    </div>`;
    return;
  }
  const start = parseDate(p.start);
  const tISO = todayISO();
  const totals = p.weeks.map(weekTotal);
  const total = totals.reduce((a,b)=>a+b,0);
  const peak = Math.max(0,...totals);
  const doneDist = p.weeks.flat().filter(d=>d.done).reduce((s,d)=>s+(parseFloat(d.dist)||0),0);
  const runs = p.weeks.flat().filter(d=>d.type && !["rest","cross","strength"].includes(d.type)).length;
  const curWeek = Math.floor((parseDate(tISO) - start) / 86400000 / 7);
  const end = addDays(start, p.weeks.length*7 - 1);

  let html = `<div class="panel">
    <div class="plan-head">
      <div class="field"><label>Plan name</label><input class="plan-name" id="pName" value="${esc(p.name)}"></div>
      <div class="field"><label>Start date</label><input type="date" id="pStart" value="${p.start}"></div>
      <div class="field"><label>Units</label><select id="pUnits"><option value="mi" ${p.units==="mi"?"selected":""}>mi</option><option value="km" ${p.units==="km"?"selected":""}>km</option></select></div>
      <div class="spacer" style="flex:1"></div>
      <button class="btn no-print" id="dupPlan">Duplicate</button>
      <button class="btn danger no-print" id="delPlan">Delete plan</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${p.weeks.length}</b><span>weeks · ${fmtShort(start)} – ${fmtShort(end)}</span></div>
      <div class="stat"><b>${fmtNum(total)} ${p.units}</b><span>total planned</span></div>
      <div class="stat"><b>${fmtNum(peak)} ${p.units}</b><span>peak week</span></div>
      <div class="stat"><b>${runs}</b><span>runs</span></div>
      <div class="stat"><b>${fmtNum(doneDist)} ${p.units}</b><span>completed${total?` (${Math.round(doneDist/total*100)}%)`:""}</span></div>
    </div>
    <div class="chart" title="Weekly volume">
      ${totals.map((t,i)=>`<div class="${i===curWeek?"cur":""}" style="height:${peak?Math.max(2,t/peak*100):2}%" title="Week ${i+1}: ${fmtNum(t)} ${p.units}"></div>`).join("")}
    </div>
  </div>
  <div class="toolbar no-print">
    <button class="btn" id="addWeekEnd">+ Add week at end</button>
    <button class="btn" id="addWeekStart">+ Add week at start</button>
    ${curWeek>=0 && curWeek<p.weeks.length ? `<button class="btn" id="jumpToday">Jump to this week</button>`:""}
  </div>
  <div class="grid">
    <div class="hd">Week</div>${DAYS.map(d=>`<div class="hd">${d}</div>`).join("")}<div class="hd">Total</div>`;

  p.weeks.forEach((week, w) => {
    const wStart = addDays(start, w*7);
    html += `<div class="week-row ${w===curWeek?"current":""}" id="week-${w}">
      <div class="week-label"><b>Week ${w+1}</b><span class="hint">${fmtShort(wStart)}</span>
        <div class="acts">
          <button data-act="copy" data-w="${w}" title="Duplicate this week below">Copy</button>
          <button data-act="up" data-w="${w}" title="Move up">↑</button>
          <button data-act="down" data-w="${w}" title="Move down">↓</button>
          <button data-act="clear" data-w="${w}" title="Clear all days">Clear</button>
          <button data-act="del" data-w="${w}" title="Delete week">✕</button>
        </div>
      </div>`;
    week.forEach((d, i) => {
      const date = addDays(wStart, i);
      const t = TYPES[d.type];
      const cls = ["day", !d.type?"empty":"", d.type==="rest"?"rest":"", d.done?"done":"", fmtISO(date)===tISO?"today":""].join(" ");
      html += `<div class="${cls}" data-w="${w}" data-d="${i}" style="${t?`border-left-color:${t.color}`:""}">
        <div class="date">${DAYS[i]} ${fmtShort(date)}</div>
        ${t ? `<div class="type" style="color:${t.color}">${t.label}</div>` : `<div class="hint">+ add</div>`}
        ${d.dist ? `<div class="dist">${fmtNum(+d.dist)} <small>${p.units}</small></div>` : (d.dur ? `<div class="dist">${d.dur} <small>min</small></div>`:"")}
        ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ""}
      </div>`;
    });
    html += `<div class="total"><b>${fmtNum(totals[w])}</b>${p.units}</div></div>`;
  });
  html += `</div>
  <div class="legend">${Object.values(TYPES).map(t=>`<span><i style="background:${t.color}"></i>${t.label}</span>`).join("")}</div>`;
  app.innerHTML = html;
  bindPlan(p);
}

function bindPlan(p){
  const $ = id => document.getElementById(id);
  $("pName").onchange = e => { p.name = e.target.value.trim() || "Untitled plan"; commit(); };
  $("pStart").onchange = e => { if(e.target.value){ p.start = e.target.value; commit(); } };
  $("pUnits").onchange = e => { p.units = e.target.value; commit(); };
  $("delPlan").onclick = () => {
    if(!confirmAction(`Delete "${p.name}"? This can't be undone.`)) return;
    state.plans = state.plans.filter(x => x.id !== p.id);
    state.currentId = state.plans[0]?.id || null; commit();
  };
  $("dupPlan").onclick = () => {
    const copy = JSON.parse(JSON.stringify(p)); copy.id = uid(); copy.created = Date.now(); copy.name = p.name + " (copy)";
    state.plans.push(copy); state.currentId = copy.id; commit();
  };
  $("addWeekEnd").onclick = () => { p.weeks.push(emptyWeek()); commit(); };
  $("addWeekStart").onclick = () => { p.weeks.unshift(emptyWeek()); p.start = fmtISO(addDays(parseDate(p.start), -7)); commit(); };
  if($("jumpToday")) $("jumpToday").onclick = () => {
    const w = Math.floor((parseDate(todayISO()) - parseDate(p.start)) / 86400000 / 7);
    document.getElementById("week-"+w)?.firstElementChild.scrollIntoView({behavior:"smooth", block:"center"});
  };
  app.querySelectorAll(".day").forEach(el => el.onclick = () => openDay(+el.dataset.w, +el.dataset.d));
  app.querySelectorAll(".week-label .acts button").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const w = +b.dataset.w, act = b.dataset.act;
    if(act==="copy") p.weeks.splice(w+1, 0, JSON.parse(JSON.stringify(p.weeks[w])).map(d=>({...d, done:false})));
    if(act==="up" && w>0) [p.weeks[w-1], p.weeks[w]] = [p.weeks[w], p.weeks[w-1]];
    if(act==="down" && w<p.weeks.length-1) [p.weeks[w+1], p.weeks[w]] = [p.weeks[w], p.weeks[w+1]];
    if(act==="clear") { if(!confirmAction(`Clear all days in week ${w+1}?`)) return; p.weeks[w] = emptyWeek(); }
    if(act==="del") { if(p.weeks.length<=1) return alert("A plan needs at least one week."); if(!confirmAction(`Delete week ${w+1}?`)) return; p.weeks.splice(w,1); }
    commit();
  });
}
function confirmAction(msg){ try{ return confirm(msg); }catch(e){ return true; } }
function commit(){ save(); render(); }

// ---------- day editor ----------
const dayDlg = document.getElementById("dayDlg");
const typePicker = document.getElementById("typePicker");
let editing = null, selType = "";
function paintTypes(){
  typePicker.innerHTML = Object.entries(TYPES).map(([k,t]) =>
    `<button type="button" data-t="${k}" class="${k===selType?"sel":""}" style="${k===selType?`background:${t.color};border-color:${t.color}`:`border-color:${t.color}`}">${t.label}</button>`).join("");
  typePicker.querySelectorAll("button").forEach(b => b.onclick = () => { selType = b.dataset.t===selType ? "" : b.dataset.t; paintTypes(); });
}
function openDay(w, d){
  const p = current(); editing = {w, d};
  const day = p.weeks[w][d];
  const date = addDays(parseDate(p.start), w*7 + d);
  document.getElementById("dayTitle").textContent = `Week ${w+1} · ${date.toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"})}`;
  document.getElementById("distLabel").textContent = `Distance (${p.units})`;
  selType = day.type; paintTypes();
  fDist.value = day.dist; fDur.value = day.dur; fPace.value = day.pace||""; fNotes.value = day.notes; fDone.checked = day.done;
  dayDlg.showModal();
}
const fDist = document.getElementById("fDist"), fDur = document.getElementById("fDur"),
      fPace = document.getElementById("fPace"), fNotes = document.getElementById("fNotes"), fDone = document.getElementById("fDone");
document.getElementById("dayForm").onsubmit = () => {
  const p = current(); if(!p || !editing) return;
  p.weeks[editing.w][editing.d] = {type:selType, dist:fDist.value, dur:fDur.value, pace:fPace.value.trim(), notes:fNotes.value.trim(), done:fDone.checked};
  commit();
};
document.getElementById("cancelDay").onclick = () => dayDlg.close();
document.getElementById("clearDay").onclick = () => { const p = current(); p.weeks[editing.w][editing.d] = emptyDay(); dayDlg.close(); commit(); };

// ---------- new plan ----------
const newDlg = document.getElementById("newDlg");
const nTemplate = document.getElementById("nTemplate"), nUnits = document.getElementById("nUnits");
const nStartVol = document.getElementById("nStartVol"), nPeakVol = document.getElementById("nPeakVol");
function syncTemplateFields(){
  const g = GOALS[nTemplate.value];
  document.getElementById("volRow").style.display = g ? "flex" : "none";
  document.getElementById("tplHint").style.display = g ? "block" : "none";
  if(g){
    const f = nUnits.value==="km" ? KM : 1;
    nStartVol.value = Math.round(g.start*f); nPeakVol.value = Math.round(g.peak*f);
    document.getElementById("nName").value = g.name + " plan";
  }
}
nTemplate.onchange = syncTemplateFields; nUnits.onchange = syncTemplateFields;
document.getElementById("newPlanBtn").onclick = () => {
  document.getElementById("nStart").value = fmtISO(mondayOf(addDays(new Date(), 6)));
  nTemplate.value = "blank"; document.getElementById("nName").value = "My training plan";
  syncTemplateFields(); newDlg.showModal();
};
document.getElementById("cancelNew").onclick = () => newDlg.close();
document.getElementById("newForm").onsubmit = () => {
  const weeksN = Math.min(52, Math.max(1, parseInt(document.getElementById("nWeeks").value)||12));
  const units = nUnits.value, tpl = nTemplate.value;
  const sv = parseFloat(nStartVol.value)||10, pv = Math.max(sv, parseFloat(nPeakVol.value)||sv);
  const plan = {
    id: uid(),
    created: Date.now(),
    name: document.getElementById("nName").value.trim() || "My training plan",
    start: document.getElementById("nStart").value,
    units,
    weeks: GOALS[tpl] ? buildTemplate(tpl, weeksN, sv, pv, units) : Array.from({length:weeksN}, emptyWeek)
  };
  state.plans.push(plan); state.currentId = plan.id; commit();
};

// ---------- header actions ----------
planSelect.onchange = e => { state.currentId = e.target.value; commit(); };
document.getElementById("printBtn").onclick = () => window.print();
document.getElementById("exportBtn").onclick = () => {
  const p = current();
  const data = p ? {stride:1, plans:[p]} : {stride:1, plans:state.plans};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (p ? p.name.replace(/[^\w-]+/g,"_") : "stride-plans") + ".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = async e => {
  const file = e.target.files[0]; if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    const plans = Array.isArray(data.plans) ? data.plans : (data.weeks ? [data] : []);
    if(!plans.length) throw new Error("No plans found");
    plans.forEach((p, i) => { p.id = uid(); p.created = Date.now() + i; if(!p.weeks || !p.start) throw new Error("Bad plan"); state.plans.push(p); });
    state.currentId = state.plans[state.plans.length-1].id; commit();
  }catch(err){ alert("Couldn't import that file: " + err.message); }
  e.target.value = "";
};

load();
if(!current() && state.plans.length) state.currentId = state.plans[0].id;
render();
initCloud();
})();
</script>
